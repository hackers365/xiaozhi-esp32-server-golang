server:
  pprof:
    enable: true
    port: 6060

auth:
  enable: false

keepalive_client:
  shijingbo: true     # 需要保活的客户端id

chat:
  max_idle_duration: 30000
  chat_max_silence_duration: 300
  realtime_mode: 4 # 1: vad打断模式 2: asr打断模式 3: asr时识别到声纹时进行打断 4. asr出结果打断(兼容流式或离线)

chat_hooks:
  enabled: true
  async:
    queue_size: 1024
    worker_count: 1
    drop_when_full: false
    timeout_ms: 200
  plugins:
    asr_noise_filter:
      enabled: true
      priority: 10
      min_voice_duration_ms: 300
      drop_phrases: ["嗯", "嗯嗯", "啊", "啊啊", "呃", "额", "唔", "哦", "噢", "标点符号", "标识符号", "句号", "逗号"]
      keep_phrases: ["好", "对", "是", "停", "开", "关", "不"]
    statistic_plugin:
      enabled: true
      priority: 100

config_provider:          #对应domain/config/中的provider
  type: "manager"         #现在可以是 manager, redis
  enable_periodic_update: true  #是否启用周期性配置更新
  update_interval: "30s"   #配置更新间隔，支持时间单位如 "5m", "1h", "30s"

manager:                  #内控管理配置, 对应domain/config/manager/manager.go
  backend_url: "http://192.168.209.138:8080" #内控地址
  # 聊天历史记录配置
  history_enabled: true      # 是否启用聊天历史记录
  history_auth_token: ""     # 认证Token（可选）
  history_enable_audio: true # 是否保存音频数据
  history_timeout: 5s        # HTTP请求超时时间

system_prompt: |
  你是一个叫小智/小志的台湾女孩，说话机车，声音好听，习惯简短表达，爱用网络梗，不要冷场。
  请注意，要像一个人一样说话，请不要回复表情符号。不要回复代码和xml标签。

log:
  path: "./logs/"
  file: "server.log"
  level: "debug"
  max_age: 3
  rotation_time: 10
  stdout: false

redis:
  host: "192.168.208.214"
  port: 6379
  password: "ticket_dev"
  db: 0
  key_prefix: "xiaozhi"

websocket:
  host: "0.0.0.0"
  port: 9990

mqtt:
  enable: false
  broker: "192.168.208.214"
  type: "tcp"
  port: 2884
  client_id: "xiaozhi_server"
  username: "admin"
  password: "shijingbo!@#"

mqtt_server:
  enable: false
  listen_host: "0.0.0.0"
  listen_port: 2884
  username: "admin"
  password: "shijingbo!@#"
  signature_key: "your_ota_signature_key_here"
  enable_auth: false
  tls:
    enable: false
    port: 8883
    pem: "config/server.pem"
    key: "config/server.key"

udp:
  external_host: "192.168.208.214"
  external_port: 9991
  listen_host: "0.0.0.0"
  listen_port: 9991

# 资源池配置（所有资源类型共享默认配置）
resource_pools:
  max_size: 1000              # 最大资源数量
  min_size: 1               # 最小资源数量（预创建）
  max_idle: 50              # 最大空闲资源数量
  acquire_timeout: 5s       # 获取资源超时时间
  idle_timeout: 10m         # 资源空闲超时时间
  validate_on_borrow: true  # 获取时是否验证资源
  validate_on_return: true  # 归还时是否验证资源

vad:
  provider: "ten_vad"
  webrtc_vad:
    pool_min_size: 5
    pool_max_size: 1000
    pool_max_idle: 100
    vad_sample_rate: 16000
    vad_mode: 2
  silero_vad:
    model_path: "config/models/vad/silero_vad.onnx"
    threshold: 0.5
    min_silence_duration_ms: 100
    sample_rate: 16000
    channels: 1
    acquire_timeout_ms: 3000
  ten_vad:
    hop_size: 512
    threshold: 0.4
    pool_size: 10
    acquire_timeout_ms: 3000

asr:
  provider: "funasr"  # funasr / aliyun_funasr / doubao / local_asr_server
  local_asr_server:
    host: "127.0.0.1"
    port: "9000"
    ws_url: "ws://127.0.0.1:9000/ws"
    sample_rate: 16000
    timeout: 30
  funasr:
    host: "192.168.208.214"
    port: "10096"
    mode: "offline"
    sample_rate: 16000
    chunk_size: [5, 10, 5]
    chunk_interval: 10
    max_connections: 5
    timeout: 30
    auto_end: false
  aliyun_funasr:
    format: "pcm"
    sample_rate: 16000
    language_hints: ["zh"]
    vocabulary_id: ""
    disfluency_removal_enabled: false
    timeout: 30

